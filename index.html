<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 한성대학교 ICT융합디자인학과 졸업전시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <main class="stage">
      <header class="stage-header">
        <h1 class="stage-title">
          <span class="stage-title-sub">2026</span>
          <span class="stage-title-main">한성대학교 ICT융합디자인학과 졸업전시</span>
        </h1>
      </header>
      <section class="wall" id="wall"></section>
    </main>
    <nav class="name-bar" aria-label="참여자">
      <ul class="name-list" id="nameList"></ul>
    </nav>
  </div>
  <div class="viewer" id="viewer" aria-hidden="true">
    <button class="viewer-close" id="viewerClose" type="button" aria-label="닫기">×</button>
    <div class="viewer-poster" id="viewerPoster">
      <p class="viewer-text" id="viewerText"></p>
      <p class="viewer-author" id="viewerAuthor"></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
